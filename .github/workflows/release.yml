name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

defaults:
  run:
    working-directory: ktctl

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild (Linux targets)
        if: runner.os == 'Linux'
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild

      - name: Install libusb (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ktctl

      # Linux: static build via zig (vendored libusb through rusb's libusb1-sys).
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --features vendored --target ${{ matrix.target }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          bin="target/${{ matrix.target }}/release/ktctl"
          out="ktctl-${{ matrix.target }}"
          cp "$bin" "$out"
          shasum -a 256 "$out" > "$out.sha256" || sha256sum "$out" > "$out.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ktctl-${{ matrix.target }}
          path: |
            ktctl/ktctl-${{ matrix.target }}
            ktctl/ktctl-${{ matrix.target }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
