[package]
name = "ktctl"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Runtime PEQ/EQ/gain control for the FiiO JA11 and KTMicro KT02H20-based dongles"
license = "BlueOak-1.0.0"
repository = "https://github.com/ParkWardRR/fiio-ja11-jcally-jm12-moondropkt02-kt02h20-dac-amp-control"
readme = "../README.md"
keywords = ["fiio", "ja11", "dac", "peq", "usb"]
categories = ["command-line-utilities", "hardware-support"]

# The USB transport is an optional feature so that the protocol core (Phase 1)
# and the CLI's fake-device mode build and test on any machine without libusb
# present. Real hardware I/O (Phase 2) lives behind `--features usb`.
[features]
default = ["usb"]
usb = ["dep:rusb"]
# Statically compile libusb from source (for dependency-free release binaries,
# e.g. via cargo-zigbuild). Implies `usb`.
vendored = ["usb", "rusb/vendored"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusb = { version = "0.9", optional = true }
ratatui = "0.28"
crossterm = "0.28"

[dev-dependencies]
pretty_assertions = "1.4"

[[bin]]
name = "ktctl"
path = "src/main.rs"

[lib]
name = "ktctl"
path = "src/lib.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
